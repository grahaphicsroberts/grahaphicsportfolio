<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Data Visualization - Final Interaction Fix</title>
    <style>
        html, body { margin: 0; overflow: hidden; width: 100%; height: 100%; background-color: #000; cursor: default; color: #FFF; font-family: sans-serif; }
        canvas { touch-action: none; }
        #overlay {
            position: absolute;
            bottom: 28px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
        }
        #overlay span {
            display: inline-block;
            padding: 14px 28px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 999px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.14em;
            color: #fff;
            text-transform: uppercase;
            box-shadow: 0 4px 32px rgba(0, 0, 0, 0.5);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        }
        #rotate-hint {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            pointer-events: none;
            z-index: 10;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 14px;
            box-shadow: 0 4px 32px rgba(0, 0, 0, 0.5);
            color: #fff;
        }
        #rotate-hint svg {
            width: 26px;
            height: 26px;
        }
        #rotate-hint .orbit-ring {
            transform-origin: 12px 12px;
            animation: orbit-spin 4s linear infinite;
        }
        @keyframes orbit-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @media (max-width: 767px) {
            #overlay { bottom: 16px; padding: 0 12px; box-sizing: border-box; }
            #overlay span {
                padding: 11px 20px;
                font-size: 11px;
                letter-spacing: 0.1em;
                max-width: 100%;
                line-height: 1.35;
            }
            #rotate-hint {
                top: 12px;
                right: 12px;
                width: 42px;
                height: 42px;
                border-radius: 12px;
            }
            #rotate-hint svg { width: 22px; height: 22px; }
        }
    </style>
</head>
<body>
    <div id="rotate-hint" title="Drag to rotate" aria-label="Drag to rotate view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <!-- Isometric cube -->
            <path d="M12 5.5 17.5 8.5v6L12 17.5 6.5 14.5v-6L12 5.5z" />
            <path d="M12 5.5v12" />
            <path d="M6.5 8.5 12 11.5 17.5 8.5" />
            <!-- Orbit ring + arrow (animated) -->
            <g class="orbit-ring">
                <path d="M4 13.5a8 8 0 0 1 13.5-5.2" />
                <path d="M16 6.5 18.5 8 16.5 10" />
            </g>
        </svg>
    </div>
    <div id="overlay"><span id="overlay-text">Click to Structure Data</span></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 1. CORE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 32); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;       
        controls.autoRotateSpeed = 0.25;  
        controls.enablePan = false;
        controls.enableZoom = false;       

        // --- 2. PING-PONG BUFFER ---
        const renderTargetParams = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat };
        let readBuffer = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, renderTargetParams);
        let writeBuffer = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, renderTargetParams);
        let sceneTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, renderTargetParams);

        const fadeMaterial = new THREE.ShaderMaterial({
            uniforms: {
                tDiffuse: { value: null }, tOld: { value: null },
                uDamp: { value: 0.988 }, uFloor: { value: 0.003 }, uTime: { value: 0.0 }
            },
            vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
            fragmentShader: `
                uniform sampler2D tDiffuse; uniform sampler2D tOld; 
                uniform float uDamp; uniform float uFloor; uniform float uTime;
                varying vec2 vUv;
                void main() {
                    vec2 drift = vec2(sin(uTime * 0.1), cos(uTime * 0.15)) * 0.0003;
                    vec4 texelNew = texture2D(tDiffuse, vUv);
                    vec4 texelOld = texture2D(tOld, vUv - drift);
                    vec4 combined = max(texelNew, texelOld * uDamp);
                    gl_FragColor = max(vec4(0.0), combined - uFloor);
                }
            `
        });

        const fadeCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const fadeQuad = new THREE.Mesh(new THREE.PlaneBufferGeometry(2, 2), fadeMaterial);
        const fadeScene = new THREE.Scene();
        fadeScene.add(fadeQuad);

        // --- 3. REIMPLEMENTED CLICK+DRAG FIX ---
        let currentState = 0; 
        let targets = { shape: 0, color: 0, split: 0, lung: 0 };
        let startX = 0, startY = 0;

        const PHASE_PROMPTS = [
            "Click to Structure Data",
            "Click to Split 25/75",
            "Click to Assemble Anatomy",
            "Click to Reset Swarm"
        ];

        function updatePrompt() {
            document.getElementById('overlay-text').innerText = PHASE_PROMPTS[currentState];
        }

        function advanceState() {
            currentState = (currentState + 1) % 4;
            targets.shape = currentState >= 1 ? 1 : 0;
            targets.color = currentState >= 2 ? 1 : 0;
            targets.split = currentState === 2 ? 1 : 0;
            targets.lung  = currentState === 3 ? 1 : 0;
            updatePrompt();
        }

        function isMobileViewport() {
            return window.innerWidth < 768 || window.matchMedia('(pointer: coarse)').matches;
        }

        function getClickThreshold() {
            return isMobileViewport() ? 22 : 7;
        }

        function getPointSizeScale() {
            return isMobileViewport() ? 1.4 : 1;
        }

        const DESKTOP_CAMERA_Z = 32;

        function updateCameraForViewport(w, h) {
            // Pull back on mobile/narrow iframes so the structured cube fits in frame.
            // Desktop widescreen keeps the original camera distance.
            const z = isMobileViewport() ? 46 : DESKTOP_CAMERA_Z;
            camera.position.set(0, 10, z);
            camera.fov = 75;
            camera.updateProjectionMatrix();
            controls.update();
        }

        function updatePointSize(h) {
            mat.uniforms.uBaseSize.value =
                0.15 * h * window.devicePixelRatio / 2.0 *
                camera.projectionMatrix.elements[5] * getPointSizeScale();
        }

        renderer.domElement.style.touchAction = 'none';

        renderer.domElement.addEventListener('pointerdown', e => {
            startX = e.clientX;
            startY = e.clientY;
        });

        renderer.domElement.addEventListener('pointerup', e => {
            const dragDistance = Math.sqrt(Math.pow(e.clientX - startX, 2) + Math.pow(e.clientY - startY, 2));
            
            // THRESHOLD: Ignore taps that were really orbit drags (higher on touch screens).
            if (dragDistance < getClickThreshold()) {
                advanceState();
            }
        });

        // Autoplay (?autoplay=3000) cycles the phases on a timer instead of by
        // click, for embeds where the demo runs as a decorative loop. The click
        // prompt and drag hint are hidden since there's nothing to act on.
        const autoplayMs = Number(new URLSearchParams(location.search).get('autoplay')) || 0;
        if (autoplayMs > 0) {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('rotate-hint').style.display = 'none';
            setInterval(advanceState, autoplayMs);
        }

        // --- 4. GEOMETRY ---
        const gridSize = 20, spacing = 1.2, count = Math.pow(gridSize, 3);
        const geo = new THREE.BufferGeometry();
        const posGrid = new Float32Array(count * 3), posSplit = new Float32Array(count * 3);
        const isBlue = new Float32Array(count), randAttr = new Float32Array(count * 3);
        const lungPos = new Float32Array(count * 3), lungCenter = new Float32Array(count * 3);

        let blueIdx = 0, grayIdx = 0;
        for (let i = 0; i < count; i++) {
            const ix = i % 20, iy = Math.floor(i / 20) % 20, iz = Math.floor(i / 400);
            posGrid[i*3] = (ix*spacing)-11.4; posGrid[i*3+1] = (iy*spacing)-11.4; posGrid[i*3+2] = (iz*spacing)-11.4;
            randAttr[i*3] = Math.random(); randAttr[i*3+1] = Math.random(); randAttr[i*3+2] = Math.random();
            const check = Math.random() < 0.25; isBlue[i] = check ? 1.0 : 0.0;
            if (check) {
                const bx = blueIdx % 12, by = Math.floor(blueIdx / 12) % 12, bz = Math.floor(blueIdx / 144);
                posSplit[i*3] = (bx*spacing)-22; posSplit[i*3+1] = (by*spacing)-7; posSplit[i*3+2] = (bz*spacing)-7; blueIdx++;
            } else {
                const gx = grayIdx % 18, gy = Math.floor(grayIdx / 18) % 18, gz = Math.floor(grayIdx / 324);
                posSplit[i*3] = gx*spacing; posSplit[i*3+1] = gy*spacing-11; posSplit[i*3+2] = gz*spacing-11; grayIdx++;
            }
            let lx, ly, lz, cx=0, cy=0, rV = Math.random();
            if(rV < 0.12) { 
                let p = Math.random(); if (p < 0.6) { lx = Math.cos(p*6.28); ly = 8.0+(p*15.0); lz = Math.sin(p*6.28); cy = 15; }
                else { let s = Math.random()>0.5?1:-1; let bT = (p-0.6)/0.4; lx = s*(bT*6.0); ly = 8.0-(bT*3.0); lz=(Math.random()-.5)*1.5; cx=lx; cy=ly; }
            } else {
                let s = rV > 0.56 ? 1 : -1; let th = Math.random()*6.28, ph = Math.acos(2.*Math.random()-1.), d = Math.pow(Math.random(),.5);
                lx = d*Math.sin(ph)*Math.cos(th)*7.5; ly = d*Math.cos(ph)*12.0; lz = d*Math.sin(ph)*Math.sin(th)*6.5;
                let t = (12.-ly)/24.; lx *= (0.4+t*1.2); lz *= (0.6+t*0.8); if (s>0 && lx<0) lx*=0.2; if (s<0 && lx>0) lx*=0.2;
                lx += s*8.5; ly -= 2.0; cx = s*8.5; cy = -2.0;
            }
            lungPos[i*3]=lx; lungPos[i*3+1]=ly; lungPos[i*3+2]=lz; lungCenter[i*3]=cx; lungCenter[i*3+1]=cy; lungCenter[i*3+2]=0;
        }

        geo.setAttribute('position', new THREE.BufferAttribute(posGrid, 3));
        geo.setAttribute('aSplitPos', new THREE.BufferAttribute(posSplit, 3));
        geo.setAttribute('aRandom', new THREE.BufferAttribute(randAttr, 3));
        geo.setAttribute('aIsBlue', new THREE.BufferAttribute(isBlue, 1));
        geo.setAttribute('aLungPos', new THREE.BufferAttribute(lungPos, 3));
        geo.setAttribute('aLungCenter', new THREE.BufferAttribute(lungCenter, 3));

        // --- 5. SHADER ---
        const mat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 }, uMixShape: { value: 0 }, uMixColor: { value: 0 }, uMixSplit: { value: 0 }, uMixLung: { value: 0 },
                uBaseSize: { value: 0.15 * window.innerHeight * window.devicePixelRatio / 2.0 * camera.projectionMatrix.elements[5] }
            },
            transparent: true, depthWrite: false, vertexShader: `
                uniform float uTime, uMixShape, uMixColor, uMixSplit, uMixLung, uBaseSize;
                attribute vec3 aSplitPos, aRandom, aLungPos, aLungCenter; attribute float aIsBlue;
                varying vec3 vColor;
                varying float vBlur;
                
                void main() {
                    vColor = mix(vec3(0.4), vec3(0.1, 0.6, 0.9), aIsBlue * uMixColor);
                    float t = uTime * 0.06;
                    vec3 swarm = vec3(sin(t*0.8)*18., cos(t*0.5)*12., sin(t*0.7)*20.) + vec3(sin(t*1.5 + aRandom.x*6.28) * 65.0 * (aRandom.y-0.5), cos(t*1.3 + aRandom.y*6.28) * 50.0 * (aRandom.z-0.5), sin(t*1.4 + aRandom.z*6.28) * 65.0 * (aRandom.x-0.5));
                    vec3 gridState = mix(position, aSplitPos, uMixSplit) + (swarm * 0.4 * sin(uMixSplit * 3.14));
                    vec3 lP = aLungPos - aLungCenter; float b = sin(uTime * 2.5) * 0.12 * smoothstep(5.0, -10.0, aLungPos.y);
                    lP.xz *= 1.0 + b; lP.y *= 1.0 + b * 0.5;
                    vec3 finalPos = mix(mix(swarm, gridState, uMixShape), lP + aLungCenter, uMixLung);
                    
                    vec4 mvPos = viewMatrix * modelMatrix * vec4(finalPos, 1.0);
                    
                    // Synthetic DOF focal plane logic
                    float focalDepth = 32.0; 
                    float distFromFocus = abs(-mvPos.z - focalDepth);
                    vBlur = smoothstep(0.0, 15.0, distFromFocus);
                    float sizeMult = 1.0 + (vBlur * 1.5);
                    
                    gl_Position = projectionMatrix * mvPos; 
                    gl_PointSize = (uBaseSize * sizeMult) / -mvPos.z;
                }
            `,
            fragmentShader: `
                varying vec3 vColor; varying float vBlur;
                void main() {
                    vec2 uv = gl_PointCoord - 0.5;
                    float dist = length(uv);
                    float softEdgeStart = mix(0.2, 0.0, vBlur);
                    float softEdgeEnd = mix(0.35, 0.5, vBlur);
                    float alpha = 1.0 - smoothstep(softEdgeStart, softEdgeEnd, dist);
                    float opacity = mix(1.6, 0.6, vBlur);
                    if (alpha < 0.05) discard; 
                    gl_FragColor = vec4(vColor * opacity, alpha);
                }
            `
        });

        scene.add(new THREE.Points(geo, mat));

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            const time = mat.uniforms.uTime.value += 0.015;
            fadeMaterial.uniforms.uTime.value = time;
            mat.uniforms.uMixShape.value += (targets.shape - mat.uniforms.uMixShape.value) * 0.05;
            mat.uniforms.uMixColor.value += (targets.color - mat.uniforms.uMixColor.value) * 0.05;
            mat.uniforms.uMixSplit.value += (targets.split - mat.uniforms.uMixSplit.value) * 0.04;
            mat.uniforms.uMixLung.value += (targets.lung - mat.uniforms.uMixLung.value) * 0.04;
            
            renderer.setRenderTarget(sceneTarget);
            renderer.clear();
            renderer.render(scene, camera);
            fadeMaterial.uniforms.tDiffuse.value = sceneTarget.texture;
            fadeMaterial.uniforms.tOld.value = readBuffer.texture;
            fadeMaterial.uniforms.uDamp.value = currentState === 0 ? 0.988 : 0.8; 
            fadeMaterial.uniforms.uFloor.value = currentState === 0 ? 0.003 : 0.05;
            renderer.setRenderTarget(writeBuffer);
            renderer.render(fadeScene, fadeCamera);
            renderer.setRenderTarget(null);
            renderer.render(fadeScene, fadeCamera);
            let temp = readBuffer; readBuffer = writeBuffer; writeBuffer = temp;
        }
        animate();

        updateCameraForViewport(window.innerWidth, window.innerHeight);
        updatePointSize(window.innerHeight);

        window.addEventListener('resize', () => {
            const w = window.innerWidth, h = window.innerHeight;
            camera.aspect = w / h;
            updateCameraForViewport(w, h);
            renderer.setSize(w, h);
            readBuffer.setSize(w, h);
            writeBuffer.setSize(w, h);
            sceneTarget.setSize(w, h);
            updatePointSize(h);
        });
    </script>
</body>
</html>
